# Example filter rules. Copy to config/filters.toml (gitignored) and
# replace with your real rules. All matching is case-insensitive on whole
# words or phrases, so a short term never matches inside a longer word.
# See PROJECT_PLAN.md, "Filter outcomes", for how these combine into
# Match / Flagged / Possible / Excluded.

[roles]
# Title must contain at least one of these to be considered at all
title_include = ["implementation", "deployment", "field engineer", "test engineer"]
title_exclude = ["intern", "vp ", "account executive"]
# Usually not a fit, but titles can mix them with a role term ("Firmware Test
# Engineer"). With a role term: flagged for a look. Without one: excluded.
title_flag_terms = ["firmware"]

[domain]
# Industries and settings, matched in the description or the company's sector
terms = ["manufacturing", "mining", "energy"]

[work]
# Kinds of work, matched in the description
terms = ["feasibility", "commissioning", "data validation"]

[location]
# Matched against the posting's location field only. A posting listing several
# locations ("A; B") gets the best tier among them. How a location is placed:
#   1. A state or province code after a comma ("Springfield, VT") decides the tier.
#      A tier that lists codes only accepts its place names with one of its own
#      codes, so "Burlington, MA" never matches a tier with place "burlington" + code VT.
#   2. Remote tied to a place in non_us_remote_terms is excluded.
#   3. place_terms match anywhere in the location.
#   4. us_wide_terms / country_terms count only for a bare country
#      ("United States") or a remote listing ("Remote - US"), not "Austin, TX, US".
#   5. Plain "Remote" goes to the first tier listing that remote term.
# Anything else is flagged if ambiguous_terms or a remote marker suggest it might
# fit, and excluded otherwise.
# Remote roles tied to these places are excluded
non_us_remote_terms = ["canada", "emea"]
# Location text that can't be placed with confidence is flagged
ambiguous_terms = []

[location.tier1]
label = "Preferred"
remote_terms = ["remote"]
us_wide_terms = ["united states"]
state_codes = ["ID"]                # US state codes; province_codes for Canada
place_terms = ["boise"]

[location.tier2]
label = "Acceptable"
place_terms = ["meridian"]

[location.tier3]
label = "Abroad, sponsorship needed"
requires_sponsorship = true
country_terms = ["example country"]
pathway_title_terms = ["engineer"]
pathway_note = "Possible occupation-based work permit route: confirm fit"

[sponsorship]
# Refusals: excluded, except for pathway titles, which are flagged to ask about
hard_no_terms = ["unable to sponsor"]
eligibility_terms = ["must be eligible to work in example country"]
positive_terms = ["visa sponsorship"]
# Restrictions no work permit gets around: always excluded, even for pathway titles
restriction_terms = ["citizens and permanent residents only"]

[description]
# Any of these in the description flags the posting for a human look
flag_terms = ["workshop", "webinar", "train the trainer"]

[travel]
max_percent = 40  # can go above this: excluded; not stated or no %: passes
