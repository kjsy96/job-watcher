# Example company list. Copy to config/companies.toml (gitignored) and
# replace with your real targets. One [[company]] block per company.
#
# source: greenhouse | lever | ashby
# board:  the company's board identifier on that platform, usually the
#         slug in its public job board URL. Confirm it when adding.
# sector: free text, used for grouping in reports.

